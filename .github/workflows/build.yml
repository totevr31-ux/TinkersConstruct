name: Build Radi's Construct

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radisconstruct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 26.3 / Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check preserved upstream snapshot
        run: python3 scripts/verify_reference.py

      - name: Build foundation with checked-in Gradle Wrapper
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          java -version 2>&1 | tee ci-logs/java-version.log
          bash ./gradlew --no-daemon --console=plain clean build --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Verify and stage runtime JAR
        run: python3 scripts/verify_jar.py

      - name: Upload compiled mod
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radisconstruct-mc26.3-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            build/reports/
          if-no-files-found: warn
          retention-days: 14
