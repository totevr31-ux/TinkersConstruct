plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
tasks.register('portMaterialResources', Exec) {
    inputs.dir('upstream/Hephaestus/src/main/resources')
    inputs.dir('upstream/Hephaestus/src/generated/resources')
    inputs.file('scripts/port_material_resources.py')
    outputs.dir(layout.buildDirectory.dir('portedResources'))
    commandLine 'python3', 'scripts/port_material_resources.py'
}
processResources {
    dependsOn tasks.named('portMaterialResources')
    from(layout.buildDirectory.dir('portedResources'))
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: project.loader_version, fabric_api_version: project.fabric_api_version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}
jar {
    from('LICENSE')
    from('NOTICE.md')
    from('licenses') { into('licenses') }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
